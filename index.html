<!DOCTYPE html>
<html>
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <br><br>
	<title>Score Analyzer</title>
</head>
<style>
    h1 {
        background-color: #73877b;
        width: 500px;
        height: 60px;
        margin-left: 310px;
        padding-top: 2px;
        border-radius: 20px;
        border: 4px solid #E2B1AE;
        color: white;
    }

    body{
        background-color: #E5D1D0;
        font-family: Gill Sans;
    }

    .container2 {
        background-color: #73877b;
        width: 350px;
        height: 100px;
        margin-left: 385px;
        padding-top: 30px;
        border-radius: 20px;
        border: 4px solid #E2B1AE;
        color: white;
    }

    footer{
        color: gray;
    }
    
    footer:hover {
        color: black;
    }

    img{
        border-radius: 20px;
        border: 4px solid #E2B1AE;
    }
    
    details{
        color: white;
        font-weight: bold ;
    }

    label{
        color: white;
        font-weight: bold;
    }
</style>
<body>

	<div class="container text-center">
        	<h1><b>Score Analyzer</b></h1>
        	<br>

                    <details ontoggle="instructions()">
                    <summary>Instructions</summary>
                    <i id="Show"></i>
                    </details><br>
                	
                	<div class="row justify-content-center">
                        <div class="col-md-auto">
                            <label>English<br><img src="eng.jpg" width="206px"><br><br><input type="number" id="eng" class="form-control"></label>
                        </div>
                        <div class="col-md-auto">
                            <label>Filipino<br><img src="fil.jpg" width="200px"><br><br><input type="number" id="fil" class="form-control"></label>
                        </div>
                        <div class="col-md-auto">
                            <label>Social Studies<br><img src="ss.jpg" width="200px"><br><br>
                        <input type="number" id="ss" class="form-control"></label>
                        </div>
                    </div>
                	<button type="btn" class="btn btn-light btn-custom mt-3" onclick="grades()">Analyze</button>
            	   </details>
                <br><br>

                <div class=container2>
                <p id="tscore">Total Score</p>
                </div>
                <br><br>

                <footer>
                    <p>Note: <i>Grading Criteria and Equivalents can vary depending on school or district.</i></p>
                    <hr>
                    <p>@Heleina Laconsay</p>
                </footer>
    </div>

    <script>

 		function grades() {
 			let eng = Number(document.getElementById('eng').value);
  			let fil = Number(document.getElementById('fil').value);
  			let ss = Number(document.getElementById('ss').value); 	

  			let avrg = (eng + fil + ss) / 3;
  			let rndavrg = Math.round(avrg * 100) / 100;

  			switch (true) {
                case (avrg >= 94 && avrg <= 100):
            document.getElementById("tscore").innerHTML = "Your grades are <b>Excellent</b>! Your average is " + rndavrg;
            break;

            	case (avrg >= 87 && avrg < 94):
            document.getElementById("tscore").innerHTML = "Your grades are <b>Above Satisfactory</b>! Your average is  " + rndavrg;
                	break;

            	case (avrg >= 80 && avrg < 87):
            document.getElementById("tscore").innerHTML = "Your grades are <b>Satisfactory</b>! Your average is " + rndavrg;
                	break;

            	case (avrg >= 75 && avrg < 80):
            document.getElementById("tscore").innerHTML = "Your grades <b>Need Improvement</b>. Your average is " + rndavrg;
                	break;

            	case (avrg >= 70 && avrg < 75):
            document.getElementById("tscore").innerHTML = "Your grades are <b>Poor</b>. Your average is " + rndavrg;
                	break;

            	default:
            document.getElementById("tscore").innerHTML = "Your input is invalid.";
        		}
 	 		}

            function instructions(){
                document.getElementById("Show").innerHTML= "Enter your grades in the following subjects.";
            }

	</script>

</body>
</html>
